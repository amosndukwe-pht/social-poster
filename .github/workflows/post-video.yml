name: Post video

# Runs once daily. Uploads the oldest queued video to YouTube as a
# private video, then moves it from to-postMH to postedMH.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 15 * * *"  # once daily, 15:00 UTC

permissions:
  contents: write

jobs:
  post-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube token
        run: printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Run posting script
        run: python3 post.py

      - name: Remove YouTube token
        if: always()
        run: rm -f token.json

      - name: Commit moved file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add to-postMH postedMH
          git diff --cached --quiet || git commit -m "Move posted video [skip ci]"
          git push
